name: Rebuild mimeo-templates.github.io

# profile/README.md is the template list for both the org profile and
# the index site; the mimeo-templates.github.io repo pulls it in at build time.
on:
  push:
    branches: ["main"]
    paths: ["profile/README.md"]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the mimeo-templates.github.io Pages build
        run: gh workflow run pages.yml -R mimeo-templates/mimeo-templates.github.io
        env:
          GH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
